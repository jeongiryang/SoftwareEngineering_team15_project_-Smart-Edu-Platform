name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Validate, test, and check
    runs-on: ubuntu-latest
    env:
      DIRECT_URL: postgresql://ci_user:ci_password@localhost:5432/smart_edu_ci?schema=public
      DATABASE_URL: postgresql://ci_user:ci_password@localhost:5432/smart_edu_ci?schema=public
      JWT_SECRET: ci-test-jwt-secret

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            src/backend/package-lock.json
            src/frontend/package-lock.json

      - name: Install backend dependencies
        run: npm ci --prefix src/backend

      - name: Install frontend dependencies
        run: npm ci --prefix src/frontend

      - name: Validate Prisma schema
        run: npm run validate:prisma

      - name: Generate Prisma Client
        run: npm --prefix src/backend run prisma:generate

      - name: Run tests
        run: npm test

      - name: Run project checks
        run: npm run check

  deploy_backend:
    name: Deploy backend after Prisma migration
    runs-on: ubuntu-latest
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: src/backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Validate Prisma schema for production deploy
        run: npx prisma validate

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: List Prisma migration files
        run: |
          echo "Current Prisma migration files:"
          find prisma/migrations -maxdepth 2 -type f | sort || true

      - name: Deploy Prisma migrations to production database
        run: npx prisma migrate deploy

      - name: Trigger Render backend deploy
        run: curl -fsS -o /dev/null "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
