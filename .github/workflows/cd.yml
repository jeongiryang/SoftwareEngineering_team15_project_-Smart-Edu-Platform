name: CD

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy_backend:
    name: Deploy backend after Prisma migration
    runs-on: ubuntu-latest
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    defaults:
      run:
        working-directory: src/backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}

    steps:
      - name: Checkout workflow run commit
        if: github.event_name == 'workflow_run'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Checkout manual dispatch commit
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Validate Prisma schema for production deploy
        run: npx prisma validate

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: List Prisma migration files
        run: |
          echo "Current Prisma migration files:"
          find prisma/migrations -maxdepth 2 -type f | sort || true

      - name: Deploy Prisma migrations to production database
        run: npx prisma migrate deploy

      - name: Trigger Render backend deploy
        run: curl -fsS -o /dev/null "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
